name: Skill freshness

on:
  pull_request:
    paths:
      - "skills/**"
      - ".github/workflows/skill-freshness.yml"
  push:
    branches:
      - main
    paths:
      - "skills/**"
      - ".github/workflows/skill-freshness.yml"
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check links and review dates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check source and reference links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --verbose --no-progress --max-retries 2 "skills/**/*.md"
          fail: true

      - name: Lint skill metadata and review dates
        if: always() && steps.checkout.outcome == 'success'
        run: node bin/cli.js lint skills --max-review-age-days 180
