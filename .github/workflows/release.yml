name: Release package and skills

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - AGENTS.md
      - skills/**
      - README.md
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Build and attest GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      attestations: write
      id-token: write
    outputs:
      version: ${{ steps.package.outputs.version }}
      publish: ${{ steps.npm-version.outputs.publish }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read package version and detect a version bump
        id: package
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node --input-type=module -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync('package.json', 'utf8')).version)")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid package version: $version" >&2
            exit 1
          fi
          publish=false
          if [[ "$EVENT_NAME" == "push" && "$BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            previous_version="$(git show "$BEFORE:package.json" | node --input-type=module -e "let s=''; for await (const c of process.stdin) s += c; console.log(JSON.parse(s).version)")"
            if [[ "$previous_version" != "$version" ]]; then
              publish=true
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          package_name="$(node --input-type=module -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync('package.json', 'utf8')).name)")"
          echo "package_name=$package_name" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Check whether the npm version already exists
        id: npm-version
        if: steps.package.outputs.publish == 'true'
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.package_name }}
          VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if npm view "$PACKAGE_NAME@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether this GitHub release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify package, skills, and evals
        if: steps.existing.outputs.exists != 'true' || (steps.package.outputs.publish == 'true' && steps.npm-version.outputs.published != 'true')
        run: npm run verify

      - name: Build downloadable archives
        if: steps.existing.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release/agents-md-skills-v"$VERSION" release/agents-md-bundle-v"$VERSION"

          cp -R skills release/agents-md-skills-v"$VERSION"/
          cp AGENTS.md README.md LICENSE release/agents-md-bundle-v"$VERSION"/
          cp -R skills release/agents-md-bundle-v"$VERSION"/

          (
            cd release
            zip -qr "../agents-md-skills-v$VERSION.zip" "agents-md-skills-v$VERSION"
            zip -qr "../agents-md-bundle-v$VERSION.zip" "agents-md-bundle-v$VERSION"
          )
          sha256sum agents-md-skills-v"$VERSION".zip agents-md-bundle-v"$VERSION".zip > release/SHA256SUMS.txt
          cat release/SHA256SUMS.txt

      - name: Attest downloadable release artifacts
        if: steps.existing.outputs.exists != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            agents-md-skills-v${{ steps.package.outputs.version }}.zip
            agents-md-bundle-v${{ steps.package.outputs.version }}.zip
            release/SHA256SUMS.txt

      - name: Create GitHub Release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
          TAG: ${{ steps.package.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            agents-md-skills-v"$VERSION".zip \
            agents-md-bundle-v"$VERSION".zip \
            release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "@hexjasur/agents-md v$VERSION" \
            --generate-notes \
            --latest

  publish-npm:
    name: Publish to npm with OIDC provenance
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js for npm trusted publishing
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.14.0

      - name: Install npm with OIDC trusted publishing support
        run: npm install --global npm@11.5.1

      - name: Publish public package with provenance
        run: npm publish --provenance --access public
