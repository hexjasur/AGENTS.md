name: Release package and skills

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - AGENTS.md
      - skills/**
      - README.md
      - LICENSE
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Build downloadable release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read package version
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="$(node --input-type=module -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync('package.json', 'utf8')).version)")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid package version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Skip when this version already has a release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$TAG already exists; nothing to release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify package and skills
        if: steps.existing.outputs.exists != 'true'
        run: npm run verify

      - name: Build downloadable archives
        if: steps.existing.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release/agents-md-skills-v"$VERSION" release/agents-md-bundle-v"$VERSION"

          cp -R skills release/agents-md-skills-v"$VERSION"/
          cp AGENTS.md README.md LICENSE release/agents-md-bundle-v"$VERSION"/
          cp -R skills release/agents-md-bundle-v"$VERSION"/

          (
            cd release
            zip -qr "../agents-md-skills-v$VERSION.zip" "agents-md-skills-v$VERSION"
            zip -qr "../agents-md-bundle-v$VERSION.zip" "agents-md-bundle-v$VERSION"
          )
          sha256sum agents-md-skills-v"$VERSION".zip agents-md-bundle-v"$VERSION".zip > release/SHA256SUMS.txt
          cat release/SHA256SUMS.txt

      - name: Create GitHub Release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
          TAG: ${{ steps.package.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            agents-md-skills-v"$VERSION".zip \
            agents-md-bundle-v"$VERSION".zip \
            release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "@hexjasur/agents-md v$VERSION" \
            --generate-notes \
            --latest
